Python基础与环境搭建:
  第1讲：Python生态与编程起步:
    detail: |-
      介绍 Python 在大数据分析生态中的核心地位。演示 Anaconda 环境安装与 Jupyter Notebook 基本操作。讲解 Python 变量、数据类型（int/float/str/list/dict）、基本运算符、条件判断（if-elif-else）、循环（for/while）与函数定义。使用 Pandas 的 read_csv/read_excel 读取数据文件，调用 head()/info()/describe() 完成基本浏览与描述统计。实操：搭建 Python 数据分析环境，读取宏观经济数据（GDP/CPI 等），编写循环计算各指标均值与标准差，输出汇总表。
    duration: 0.1
  第2讲：NumPy与Pandas精讲:
    detail: |-
      讲解 NumPy 核心数据结构 ndarray，演示向量化运算的高效性（对比 Python 原生 for 循环 10-100 倍差异），介绍数组创建、切片索引（fancy indexing）与广播机制（broadcasting）。深入 Pandas 的 Series/DataFrame 数据模型：loc/iloc 索引筛选、布尔过滤多条件查询、groupby 分组聚合（单列/多列 + agg 多重函数）、merge/concat 多表关联与拼接。实操：载入城市统计年鉴数据（GDP/人口/财政收入），完成按省份分组汇总与多表横向关联，输出汇总分析表。
    duration: 0.1
数据采集与清洗:
  第3讲：网络数据采集实战（上）:
    detail: |-
      讲解 HTTP 协议基础：GET/POST 请求方法、常见状态码（200/403/404/500）、User-Agent 与 Cookie 的作用。使用 requests 库发送带参数请求并解析 JSON 响应。实操：调用一个开放 API 获取经济指标数据（如国家统计局或 FRED），将返回的 JSON 转换为 Pandas DataFrame。
    duration: 0.1
  第3讲：网络数据采集实战（下）:
    detail: |-
      讲解 BeautifulSoup 网页解析：定位 HTML 元素（find/find_all + CSS 选择器），提取表格与列表数据。剖析爬虫的法律边界——robots.txt 协议、网站服务条款、个人信息保护法规中的合法/违法场景判别。实操：编写爬虫从网页中抓取经济时间序列数据，保存为结构化的 CSV 文件。
    duration: 0.1
  第4讲：数据清洗的原则与方法（上）:
    detail: |-
      以"垃圾进，垃圾出"（GIGO）原则切入，讲解缺失值识别（isna）、可视化缺失矩阵（missingno）。对比四种填充策略：均值/中位数填充、前向/后向填充、插值法、KNN 预测填充，分析各策略的适用场景与偏差影响。实操：对一份含缺失值的财务数据集，分别执行不同填充策略并对比结果。
    duration: 0.1
  第4讲：数据清洗的原则与方法（下）:
    detail: |-
      讲解异常值检测的两种核心方法：Z-Score（正态假定）与 IQR 四分位距法（鲁棒性更好）。演示箱线图可视化异常值分布、分位数截断（winsorize）与剔除策略的抉择。介绍 Min-Max 归一化与 Z-Score 标准化，分析二者的使用前提与局限性。实操：对"脏"的上市公司财务数据执行端到端清洗——缺失值填充→异常值检测与处理→数据标准化，输出清洗前后对比报告。
    duration: 0.1
探索性数据分析与可视化:
  第5讲：统计可视化（上）:
    detail: |-
      "一图胜千言"——讲解 Matplotlib 基础架构：figure/axes 画布模型、折线图（plot）、柱状图（bar）、散点图（scatter）的绘制，以及标题/图例/轴标签的定制化配置。实操：使用 Matplotlib 绘制 GDP 增长率的折线图与柱状图组合，标注关键经济事件（金融危机、疫情冲击等）。
    duration: 0.1
  第5讲：统计可视化（下）:
    detail: |-
      讲解 Seaborn 高级统计绘图：分布图（histplot/kdeplot）、分类图（boxplot/violinplot）、关系图（scatterplot/lmplot）、热力图（heatmap）。演示双 Y 轴（twinx）、多面板子图（subplots）布局与时间序列的季节性分解。实操：绘制 GDP、CPI、M2 的多面板联动图，撰写简要的数据洞察笔记。
    duration: 0.1
  第6讲：探索性数据分析（上）:
    detail: |-
      系统讲解 EDA 方法论——从单变量分析到双变量分析到多维探索的递进逻辑。单变量：中心趋势（均值/中位数）、离散程度（标准差/IQR）、偏度与峰度的业务解读。双变量：散点图与 Pearson/Spearman 相关系数矩阵，分组箱线图的直观判读。实操：对省份经济数据进行单变量统计描述，输出各指标的偏度与峰度并标注异常分布的变量。
    duration: 0.1
  第6讲：探索性数据分析（下）:
    detail: |-
      讲解多维探索工具：Pairplot 对角矩阵快速扫描变量间关系、PCA 降维后二维投影观察聚类趋势、平行坐标图追踪多维模式。实操：对省份经济数据（GDP/人均收入/产业结构/城镇化率）进行完整的 EDA——计算相关性矩阵、绘制热力图并标注显著性，发现具有经济含义的规律并撰写分析简报。
    duration: 0.1
经典数据挖掘方法:
  第7讲：无监督学习——聚类与降维（上）:
    detail: |-
      "物以类聚，人以群分"——讲解 K-Means 聚类算法的核心原理：质心初始化（K-Means++）→ 分配样本到最近质心 → 更新质心位置的迭代过程。重点讲解 K 值选择的两种方法——肘部法则（Elbow Method，观察 SSE 拐点）与轮廓系数（Silhouette Score，衡量簇内紧密度与簇间分离度）。实操：以城市经济特征为输入（GDP/增速/产业结构/收入），运行 K-Means 并绘制肘部曲线确定最佳 K 值。
    duration: 0.1
  第7讲：无监督学习——聚类与降维（下）:
    detail: |-
      讲解主成分分析（PCA）的核心直觉——寻找数据方差最大的投影方向，将高维数据在低维空间中可视化。以经济数据为例，演示协方差矩阵、特征值与方差解释比例（scree plot），讲解前两个主成分的二维散点图与聚类结果的叠加可视化。实操：用 PCA 将城市经济特征降维至 2D，叠加 K-Means 聚类结果，解读各聚类的经济含义并命名（如"高增长制造业城市""服务业主导城市"）。
    duration: 0.1
  第8讲：关联规则挖掘（上）:
    detail: |-
      以"啤酒与尿布"经典案例开场，讲解关联规则的三项核心度量——支持度（Support，规则的普遍性）、置信度（Confidence，规则的可靠性）、提升度（Lift，规则是否超过随机共现，Lift > 1 才有意义）。介绍 Apriori 算法的逐层搜索策略与剪枝原理。实操：将电商订单数据转换为事务矩阵，设定最小支持度与置信度运行 Apriori 算法。
    duration: 0.1
  第8讲：关联规则挖掘（下）:
    detail: |-
      讲解规则筛选策略：按 Lift 降序排列、按置信度与支持度联合过滤、去除冗余规则（超集规则被更简洁的子集规则包含）。经济场景应用：电商捆绑销售策略（哪些商品常被一起购买？）、银行产品交叉销售分析。实操：基于电商交易数据，使用 mlxtend 库挖掘高频商品关联，筛选 Lift > 1.5 的规则并给出业务建议。
    duration: 0.1
  第9讲：文本挖掘基础（上）:
    detail: |-
      打破"只有数字才是数据"的观念——非结构化文本如何量化分析。讲解中文分词：jieba 的三种模式（精确/全/搜索引擎模式）、加载自定义词典（经济学专有名词如"量化宽松"），以及去停用词的策略。实操：对中国央行货币政策报告进行分词处理，查看高频词云图。
    duration: 0.1
  第9讲：文本挖掘基础（下）:
    detail: |-
      讲解 TF-IDF（词频-逆文档频率）的数学直觉——为什么 IDF 能过滤掉"的""了"这类常见但无信息量的词。使用 sklearn 的 TfidfVectorizer 将央行报告文本向量化为数值矩阵。介绍基于情感词典（SnowNLP）计算文本情感倾向得分，绘制政策语调的时序曲线。实操：抓取多期央行货币政策报告，计算每期的 TF-IDF 关键主题词与情感倾向指数，分析政策态度变化趋势。
    duration: 0.1
机器学习与预测建模:
  第10讲：机器学习的思维框架（上）:
    detail: |-
      建立机器学习全局认知——"问题定义→数据准备→模型选择→评估→优化"的完整思维链。辨析关键任务类型：监督学习 vs 无监督学习、分类 vs 回归、生成模型 vs 判别模型，用经济学实例逐一说明（GDP 预测=回归、企业违约判断=分类）。讲解偏差-方差权衡（Bias-Variance Tradeoff）通过多项式拟合可视化演示欠拟合与过拟合现象。实操：用不同复杂度的多项式模型拟合经济数据，观察训练集与测试集误差的变化。
    duration: 0.1
  第10讲：机器学习的思维框架（下）:
    detail: |-
      讲解模型验证与评估体系。验证方法：留出法（Hold-out）、K 折交叉验证（K-Fold CV）、时间序列特有的时序交叉验证（TimeSeriesSplit）。评估指标：分类——准确率/精确率/召回率/F1/ROC-AUC 的适用场景（样本不均衡时用 PR 曲线）；回归——MAE/MSE/RMSE/R² 的使用与局限。实操：构建完整的分类建模流水线（Pipeline），用交叉验证评价模型，对比不同评估指标的解读差异。
    duration: 0.1
  第11讲：线性回归与逻辑回归（上）:
    detail: |-
      "简单不等于简陋"——讲解多元线性回归的最小二乘法（OLS）原理：最小化残差平方和、回归系数 = 保持其他变量不变的自变量边际效应。解读 R² 与调整后 R² 的含义差异（变量越多调整后 R² 越保守），讲解多重共线性检测（VIF > 10 即为严重共线性）。实操：使用 OLS 对房价数据进行多元回归，解读各因素（面积/地段/房龄）对房价的边际贡献。
    duration: 0.1
  第11讲：线性回归与逻辑回归（下）:
    detail: |-
      讲解从线性回归到逻辑回归的桥梁——Sigmoid 函数将实数映射到 (0,1) 概率空间。介绍极大似然估计（MLE）作为优化目标，决策阈值的选择（默认 0.5 并非始终最优）。重点讲解正则化：L1（Lasso，稀疏解，自动特征选择）vs L2（Ridge，收缩系数）vs Elastic Net（两者结合）。实操：用 Lasso 回归从数十个候选特征中自动筛选影响房价的关键因素，解读入选特征的经济含义。
    duration: 0.1
  第12讲：决策树与集成学习（上）:
    detail: |-
      讲解决策树的核心原理：递归二分划分的贪心策略、基尼不纯度（分类）与 MSE 缩减（回归）作为划分标准、树的可视化与规则解读（每个叶节点=一条 if-then 规则）。演示预剪枝（max_depth/min_samples_split）防止过拟合的效果。实操：用决策树对上市公司财务指标建模，可视化生成树结构并提取关键规则。
    duration: 0.1
  第12讲：决策树与集成学习（下）:
    detail: |-
      "三个臭皮匠顶个诸葛亮"——讲解集成学习两大范式。随机森林：Bagging 自助采样 + 随机特征子空间的双重随机性，袋外估计（OOB）无需额外验证集。XGBoost/LightGBM：Boosting 逐步纠错（新树拟合残差），XGBoost 的正则化目标函数与 LightGBM 的 GOSS/EFB 加速策略。实操：用 XGBoost 构建企业财务造假预测模型，对比逻辑回归/决策树/XGBoost 的 AUC 差异。
    duration: 0.1
  第13讲：时间序列预测（上）:
    detail: |-
      以 GDP、CPI、股价等经济指标的天然时间属性切入。讲解平稳性——均值/方差/自协方差不随时间变化，ADF 检验的判读方法（P 值 < 0.05 即为平稳），差分变换将非平稳序列转化为平稳序列。讲解 ARIMA 模型的三组件——AR（自回归）+ I（差分）+ MA（移动平均），ACF/PACF 图辅助定阶。实操：选一宏观经济指标，进行 ADF 检验并做差分平稳化，绘制 ACF/PACF 图。
    duration: 0.1
  第13讲：时间序列预测（下）:
    detail: |-
      讲解机器学习方法处理时间序列——通过滑动窗口将时间序列转化为监督学习问题：以 t-1, t-2, ..., t-p 为特征、t 时刻为目标值，使 XGBoost/随机森林可用于时间序列。对比时序交叉验证（扩展窗口 vs 滚动窗口）与普通 K-Fold 的关键差异（防止未来信息泄漏）。实操：选取宏观经济指标，分别使用 ARIMA 与 XGBoost 进行滚动预测，对比 RMSE 与预测趋势的合理性。
    duration: 0.1
机器学习进阶与综合实战:
  第14讲：模型融合与Stacking（上）:
    detail: |-
      "组合胜过单一"——讲解 Bagging 与 Boosting 的原理差异：Bagging 并行训练同类模型 → 投票/平均 → 降方差；Boosting 序贯训练 → 纠错聚焦 → 降偏差。实操：在同一数据集上分别实现 Bagging（随机森林）与 Boosting（XGBoost），对比二者的学习曲线（训练集与验证集误差随迭代变化）。
    duration: 0.1
  第14讲：模型融合与Stacking（下）:
    detail: |-
      讲解 Stacking（堆叠泛化）两层架构——第一层用 K-Fold 交叉验证训练多个异构基学习器（线性回归 + 随机森林 + XGBoost），第二层元学习器自动学习各模型的适用条件与权重分配。经济预测场景实战价值：当"模型 A 对增长期预测准、模型 B 对衰退期预测准"时 Stacking 如何自动分工。实操：组合线性回归/随机森林/XGBoost 构建 Stacking 模型预测城市房价，对比单一模型与融合模型的性能差异。
    duration: 0.1
  第15讲：异常检测与可解释机器学习（上）:
    detail: |-
      讲解两种主流异常检测方法。(1) 孤立森林（Isolation Forest）——利用异常点"少而不同"的特点，通过随机划分树的深度识别异常，不需要计算距离或密度。(2) LOF（Local Outlier Factor）——基于局部密度比较，可识别不同密度区域中的局部异常。实操：用孤立森林对上市公司财务数据进行异常检测，标记异常样本并分析其特征。
    duration: 0.1
  第15讲：异常检测与可解释机器学习（下）:
    detail: |-
      "不仅要预测得准，还要解释得通"——讲解两大模型可解释性工具。(1) SHAP——基于博弈论 Shapley 值分解每个特征对单个预测的贡献，输出全局特征重要性 + 个体预测的驱动因子。(2) LIME——在预测样本附近训练可解释的代理模型，适合向非技术受众解释决策原因。实操：对第12讲的财务造假检测模型进行 SHAP 分析，输出特征重要性排名并解读某个高风险样本的正负向贡献。
    duration: 0.1
  第16讲：现代数据挖掘前沿（上）:
    detail: |-
      建立对深度学习的入门认知——人工神经网络基本单元（感知机）、激活函数（ReLU/Sigmoid/Tanh）、多层感知机（MLP）与反向传播直觉。讲解"为什么深度学习需要大数据和 GPU"（参数量级与矩阵并行）。实操：使用 PyTorch 搭建一个微型神经网络做简单的回归任务，观察损失函数的下降过程。
    duration: 0.1
  第16讲：现代数据挖掘前沿（下）:
    detail: |-
      讲解 LSTM 处理时间序列——RNN 的梯度消失问题 → LSTM 遗忘门/输入门/输出门的选择性记忆机制，在经济/金融预测场景的应用案例。介绍大语言模型（LLM）在经济学中的前沿应用：NLP 情感分析提取政策信号、文本到结构化数据自动抽取。前沿话题讨论：AutoML 是否会取代分析师？因果推断与预测建模的本质区别。。
    duration: 0.1
