模型接口对接:
  OpenAI兼容协议规范:
    detail: |-
      以"寄快递"类比 HTTP 请求讲清 URL（收件地址）、Header（快递单上的备注）、Body（包裹内容）三者关系。逐字段拆解 Chat Completion API 的请求体：model 指定模型、messages 承载对话历史、stream 控制响应模式。重点解析 messages 数组中三种角色——system（导演：设定全局规则与行为边界）、user（演员：提出具体需求与问题）、assistant（回放：记录模型的历史回复），演示多轮对话中交替拼接 role 实现上下文延续。介绍国内外兼容 OpenAI 协议的厂商（DeepSeek、通义千问、智谱 GLM、Moonshot、Together AI 等），对比各家的 base_url 差异与模型命名规范，让学生理解"接口统一、一处学会处处可用"的工程价值。注意：本节仅聚焦 HTTP 请求结构与消息角色语义，不涉及鉴权配置（留待下节）与参数调优（留待后续）。实操：构造包含 system/user/assistant 的三轮对话请求，分别测试 system prompt 为空、为角色设定、为格式约束三种场景，观察并记录 assistant 回复风格的变化。
    duration: 0.5
  环境配置与鉴权管理:
    detail: |-
      用"银行卡密码"类比讲清 API 密钥的安全性——密钥泄露等于账户被盗，计费由你承担。演示三种环境变量管理方案：(1) export 临时设置，重启终端即失效；(2) .env 文件配合 python-dotenv 库加载，写入 .gitignore 防止提交；(3) IDE 环境变量配置（VS Code / PyCharm）图形化操作。实操环节分三步走：创建 Python 虚拟环境（venv）并激活 → pip install openai → 编写最小示例代码完成首次 API 调用，打印返回的模型名称与 token 用量以验证成功。易错点精讲：密钥硬编码在源码中导致 Git 泄露的真实案例复盘；Windows（setx）与 macOS/Linux（export）环境变量命令差异；虚拟环境未激活导致包导入失败；免费额度耗尽时的错误提示识别。成本管控专题：解读 API 响应的 usage 字段（prompt_tokens + completion_tokens），演示实时累计 token 消耗与费用换算，讲解多密钥轮换策略避免单密钥超额限流，设置 usage_limits 硬上限防止代码 bug 导致费用失控。
    duration: 0.5
  核心参数调优技术:
    detail: |-
      以"写作文"类比 Temperature：低温度（0~0.3）如默写课文，每次输出几乎一致，适合代码生成、事实问答、数学推理；高温度（0.7~1.0）如写小说，创意丰富但可能跑题，适合头脑风暴、文案创作。Top_p（核采样）用"挑选候选人"类比：p=0.1 只考虑概率最高的前 10% 词（保守），p=0.9 考虑前 90%（开放），Temperature 与 Top_p 通常只调其一避免过度约束。逐一演示各参数的独立影响：Max_tokens 控制回答长度上限（过短截断、过长增费）；Frequency_penalty 抑制重复用词；Presence_penalty 鼓励引入新话题；Seed 固定随机种子实现结果可复现；Stop 序列提前终止生成。本节聚焦参数本身的含义与效果，参数在不同框架中的配置方式将在 LangChain 章节统一讲解。实操：设计统一测试 prompt（如"用 200 字介绍机器学习"），分组运行高/中/低 Temperature × 高/低 Top_p 共 6 组参数，记录每组输出的长度、重复度、事实准确性，绘制参数-效果对照表并总结调参经验法则。
    duration: 0.5
  流式响应与异常处理:
    detail: |-
      对比普通模式（Non-Stream）与流式模式（Stream）的底层差异：普通模式等待服务端完整生成后一次性返回，类似"等整个视频缓冲完才播放"；流式模式基于 SSE（Server-Sent Events）协议逐 token 推送，类似"边播边放"，用户感知延迟大幅降低。演示 stream=True 参数开启后如何逐 chunk 迭代读取 delta.content 并实时 print，实现打字机效果；讲解 finish_reason 字段区分正常结束与异常截断。异常分类精讲：(1) 网络层——ConnectionError（断网/DNS 故障）、ReadTimeout（响应超时），需配置 timeout 与 max_retries；(2) 限流层——429 Too Many Requests，响应头中 Retry-After 指示等待秒数，讲解 Token 桶与 RPM/TPM 限额机制；(3) 服务层——5xx 服务端错误（502/503/504），属于临时故障可重试。重点实现指数退避重试（Exponential Backoff）：初始等待 1s，每次翻倍，最大 60s，配合 jitter 随机抖动避免惊群效应。实操：编写带重试装饰器的流式对话函数，依次模拟断网（关闭 Wi-Fi）、限流（高频并发请求触发 429）、服务异常（观察 5xx 的自动恢复），验证重试机制的鲁棒性。
    duration: 1.0

智能体架构开发:
  结构化提示词工程:
    detail: |-
      以"给 ChatGPT 写提示词的常见翻车现场"开场——问题太模糊导致回答泛泛、角色混乱导致回答穿越、缺少格式约束导致输出不可解析，引出结构化设计的必要性。系统讲解提示词三要素：(1) 角色设定（Persona）——你是谁、具备什么专业知识、说话风格如何，示例对比"你是助手"与"你是拥有 10 年经验的 Python 架构师，擅长代码审查与性能优化，回答简洁专业"的差异；(2) 任务描述（Task）——做什么、边界在哪、成功标准是什么，引入 SMART 原则确保任务可衡量；(3) 输出格式约束（Format）——指定 JSON Schema、Markdown 模板或表格结构，避免模型自由发挥导致下游解析失败。引入 CO-STAR 框架（Context-Objective-Style-Tone-Audience-Response）作为实战模板，并简要对比 CRISPE（Capacity-Role-Insight-Statement-Personality-Experiment）、AUTOMAT 等框架的适用场景。演示少样本提示（Few-shot）：在 prompt 中内嵌 2~3 组输入输出范例，显著提升格式遵循率。实操：给定"批改中学生英语作文"任务，分组用 CO-STAR 框架设计提示词，互相交换测试（对方提供一篇故意埋错的作文），根据输出质量迭代优化提示词，最终评选最优提示词方案并复盘设计思路。
    duration: 1.0
  LangChain核心组件应用:
    detail: |-
      聚焦 LangChain 最常用的 20% 核心能力，绕过冷门模块。本节定位为"框架级抽象层教学"——讲授如何用 LangChain 统一管理模型调用、提示词构造与输出解析，不重复讲解各参数含义（已在第一章完成）。第一模块——模型包装器（ChatOpenAI）：演示用同一套代码切换 OpenAI / DeepSeek / 通义千问三个后端，仅改 model 与 base_url 参数，凸显 LangChain 的多供应商抽象价值；展示 temperature、max_tokens 等参数通过 model_kwargs 统一透传的方式。第二模块——提示词模板（ChatPromptTemplate）：从简单的单变量模板（"翻译{text}为{language}"）到多消息模板（SystemMessage + HumanMessage 动态拼接），讲解 from_template 与 from_messages 两种构造方式及变量占位符语法；引入 FewShotPromptTemplate 实现动态样例注入。第三模块——输出解析器（OutputParser）：串讲 StrOutputParser（纯文本）、JsonOutputParser（JSON）、PydanticOutputParser（强类型结构化对象），重点演示 PydanticOutputParser 如何自动生成格式指令注入 prompt 并解析返回为 Pydantic 对象。链式调用实战：使用 LCEL（LangChain Expression Language）的管道符 `|` 语法串联 "翻译→摘要→分类" 三步流水线——RunnablePassthrough 透传中间结果、RunnableLambda 插入自定义转换函数、RunnableParallel 并行执行独立任务，最终输出结构化 JSON 分析报告。实操：给定一篇英文科技新闻，搭建完整链条输出包含原文摘要、中文翻译、主题分类、情感倾向的 JSON。
    duration: 1.0
  LangGraph状态机设计:
    detail: |-
      从"智能客服坐席的工作流程"引入状态机概念：接听电话 → 意图识别 → 路由判断（转人工 or 自助解决）→ 记录工单，每个环节是一个节点，条件分支是边。用 LangGraph 分别定义 State（TypedDict 声明共享数据字段）、Node（Python 函数接收 State 返回更新）、Edge（普通边无条件跳转 / 条件边根据函数返回值路由，如 intent=="refund" → human_node）。使用 Mermaid 语法可视化有向图，做到"看图写代码"。核心机制精讲：(1) 状态持久化——State 在各节点间自动合并更新，实现上下文无缝传递；(2) 条件路由——conditional_edges 根据 LLM 输出的分类结果动态选择下一节点，实现分支逻辑；(3) Checkpointing——MemorySaver 检查点机制，支持暂停/恢复与时间旅行调试。重点实现"反思-重试"循环——以内容审核场景为例：初审节点标记违规 → 复审节点校验判断合理性 → 条件边分流（确认违规则输出、证据不足则携带质疑信息返回初审重新评估），最多循环 3 次。本节聚焦状态机编排模式，与后续 CodingAgent 章节互补：LangGraph 讲"流程控制框架"，CodingAgent 讲"代码自主生成"。实操：实现一个文档审核工作流，输入文本 → 多维度审阅（格式/合规/文风）→ 自动综合审核意见 → 不达标维度触发补充审阅，最终输出通过质量门槛的审核报告。
    duration: 1.0
  外部工具调用与集成:
    detail: |-
      用"训练导盲犬"类比 Tool Calling 机制：导盲犬不认识路，但你知道给它一串"左转/右转/直行"的指令它就能带你到达目的地。同理，模型不会真正搜索或计算，但你给它函数签名和描述文档，它就能在需要时输出调用指令。讲解 OpenAI Function Calling 的标准三字段：(1) name——函数名，简洁直白（如 search_web 而非 do_search_v2）；(2) description——功能说明，写明何时使用此工具（如 "当用户询问实时信息或最新新闻时调用此函数"）；(3) parameters——JSON Schema 定义参数类型、必填项、枚举值约束，确保模型传参合法。详解工具调用全生命周期：用户消息 → 模型返回 tool_calls（含 function.name 与 JSON arguments）→ 开发者执行函数获取结果 → 将结果以 tool role 消息注入对话 → 模型基于结果生成最终回复。多工具场景：同时注册计算器（calculator）、天气查询（get_weather）、网页搜索（web_search）三个工具，观察模型如何根据用户意图（"北京今天热吗？比上海高几度？"）自主判断调用哪些工具及调用顺序；讲解 tool_choice 参数（auto/none/required/指定工具）控制调用策略。实操：扩展 Agent 接入上述三个工具，设计 5 个测试问题（纯计算、纯天气、纯搜索、计算+天气组合、无需工具），验证模型在每种场景下的工具选择准确率并记录误判案例。
    duration: 1.0

模型本地化部署:
  推理框架选型与安装:
    detail: |-
      以"选择交通工具"类比三种主流推理框架的定位差异：Ollama 如共享单车——一键安装、自动拉取模型、开箱即用，适合个人开发与学习场景；llama.cpp 如摩托车——轻量高效、C++ 实现 CPU 推理极快、GGUF 格式生态丰富，适合资源受限设备与嵌入式部署；vLLM 如高铁——PagedAttention 显存管理、连续批处理（Continuous Batching）高并发、吞吐量远超其他方案，适合生产级 API 服务。对比表：框架安装复杂度（一键脚本 vs 源码编译）、首次推理速度（Cold Start）、并发吞吐量（Tokens/s @ 16 并发）、API 兼容性（是否兼容 OpenAI /v1/chat/completions）、硬件要求（纯 CPU/GPU/Apple Silicon）。现场演示 Ollama 全流程：官网一键安装 → ollama pull qwen2.5:1.5b（2GB 内入门级，集成显卡也能跑）→ ollama run qwen2.5:1.5b 命令行对话 → ollama serve 启动 REST API → curl 调用验证接口可用。实操：学生自行安装 Ollama 并拉取 qwen2.5:1.5b，完成命令行对话与 API 调用的双重验证，记录硬件配置与推理速度（tokens/s）供下节课对比分析。
    duration: 1.0
  硬件适配与显存管理:
    detail: |-
      用"卡车搬货"类比显存与模型参数的关系：卡车载重（显存 GB）= 货箱数量（参数量 B）× 每箱重量（精度字节数）× 1.2（KV Cache 等额外开销系数）。核心公式：所需显存 ≈ 参数量 × 每参数字节数 × 1.2。示例计算：7B 模型 FP16（2 字节）→ 7×2×1.2≈16.8GB，需要 RTX 3090/4090（24GB）；INT4 量化 → 7×0.5×1.2≈4.2GB，GTX 1660（6GB）即可。对照表直观展示 1.5B/7B/14B/32B/72B 在 FP16、INT8、INT4、INT2 四种精度下的显存需求区间（附颜色标注："绿色-消费级显卡可运行""黄色-需高端显卡""红色-需多卡或云端"）。非 N 卡方案：(1) CPU 推理——llama.cpp 利用 AVX2/AVX512 指令集加速，内存即显存（32GB 内存可跑 70B INT4），速度约 2~10 tokens/s，适合离线批处理；(2) Apple M 系列——统一内存架构允许 GPU 直接访问主存，M2 Ultra 192GB 可运行 70B FP16，Metal 加速下速度可观；(3) AMD ROCm——Linux 下兼容 PyTorch，消费级 AMD 显卡的性价比方案。额外讲解：长上下文的内存爆炸问题——KV Cache 随序列长度线性增长，32K 上下文 7B 模型额外消耗约 4GB，需要注意设置合理的 max_seq_len。实操：学生查看自己电脑的 GPU 型号/显存/内存，对照表格确定适合的模型规格并记录选型依据。
    duration: 1.0
  模型权重加载与量化:
    detail: |-
      用"相册压缩"类比量化本质：FP16 原始权重（几十 MB 的 RAW 照片）→ INT4 量化权重（几百 KB 的 JPEG 照片），视觉（输出质量）几乎无差异但体积暴降。技术原理简述：将 32 位浮点权重映射到 4/8 位整数区间，通过 scale 和 zero_point 两个参数实现有损压缩——对称量化（symmetrical）计算快但精度略低，非对称量化（asymmetrical）保留更多信息但开销稍大。格式生态详解：(1) GGUF——llama.cpp 与 Ollama 的原生格式，单文件分发、内嵌元数据与 tokenizer、支持 CPU/GPU 混合推理，通过 ollama show --modelfile 可查看 Modelfile 中的量化参数；(2) AWQ（Activation-Aware Weight Quantization）——基于激活值分布的重要通道保留高精度，适合 GPU 推理，vLLM 原生支持；(3) GPTQ——逐层 Hessian 矩阵优化，4-bit 精度下困惑度提升极小，适合追求最高质量的量化场景。Modelfile 实战：FROM 指定基础模型 → PARAMETER temperature 0.7 → PARAMETER num_ctx 4096 → SYSTEM 设定系统提示词，ollama create 自定义模型名并部署。实操：拉取同一模型的 Q4_K_M（4-bit 中等质量）、Q8_0（8-bit）、FP16 三个版本，跑相同 benchmark prompt 各 10 次，记录推理速度（tokens/s）、显存占用（nvidia-smi 监控）、输出质量（人工 1-5 分评分），绘制三者的速度-质量-资源三维对比图。
    duration: 0.5

行业场景实测:
  基于大模型的作业自动评估应用:
    detail: |-
      痛点剖析：传统作业评分依赖教师个人经验，不同教师评分标准差可达 15~20 分，且同一个教师在不同时段评分也会有"疲劳偏差"和"首因效应"。方案设计：引入棋类竞技中的 Elo 等级分算法——大模型扮演裁判角色，不直接给出绝对分数，而是每次从作业池中随机抽取两份作业（A vs B），让模型从指定维度（如逻辑严谨性、论证充分性、表达清晰度）判断哪份更优。"相对评价"机制天然消除绝对评分的尺度漂移问题：教师只需准备 3~5 份锚点作业（金牌/银牌/铜牌标准范例），其余作业通过与锚点的待定比较即可自动定位能力层级。技术链路：(1) 锚点构造——教师精选典型作业并手动标注等级作为参照系；(2) 配对策略——采用 Swiss-system 式轮次配对，每份作业与同 Elo 区间对手比较 3~5 轮，避免强弱悬殊的无效比较；(3) 裁决 Prompt——结构化 prompt 约束模型输出 JSON 格式的胜者/败者/理由/置信度，置信度低于阈值则提交人工仲裁；(4) Elo 更新——使用 K-factor=32 的标准公式迭代，每轮比较后立即更新分数；(5) 收敛检测——当全体现有分数的最大单轮变动 <2 分时停止配对，输出最终排名。实操：准备 20 份学生作业（或生成模拟数据）→ 人工构造金银铜 3 个锚点 → 编写配对裁决 Agent → 运行 3 轮配对 → 计算 Elo 积分并输出排名 → 与人工评分排名进行 Spearman 相关系数对比，分析一致性。
    duration: 1.5
  基于RAG的Kaggle搜索辅助应用:
    detail: |-
      痛点剖析：Kaggle 拥有数十万数据集和百万 Notebook，原生搜索仅支持关键词匹配，"适合 SVM 的医疗图像数据"这类语义查询根本搜不到；即使找到数据集，还需手动翻阅 Notebook 判断是否适用于自己的场景。方案设计：构建"数据集 + Notebook"双索引向量知识库——对数据集卡片（标题、描述、标签、列名）和 Notebook 摘要进行 Embedding，实现跨模态语义检索。技术链路：(1) 数据采集——通过 Kaggle API 批量拉取指定领域的数据集元数据与高赞 Notebook 的前 500 字摘要；(2) 文本切片——数据集卡片采用结构化分块（标题/描述/列名/文件列表各自独立 chunk，保留元数据标签），Notebook 摘要采用 RecursiveCharacterTextSplitter（chunk_size=512，chunk_overlap=64）保证语义完整；(3) Embedding 选型——对比 text-embedding-3-small（OpenAI, 1536 维）与 bge-large-zh-v1.5（BAAI 中文优化, 1024 维）在中文 query 场景下的检索精度；(4) 向量数据库——Faiss 的 IVF+PQ 索引实现 10 万+量级的毫秒级检索，Chroma 提供轻量级本地持久化与元数据过滤；(5) 检索策略——先用粗筛（Top-20）→ 再用 Cross-Encoder Reranker（bge-reranker-v2-m3）精排 Top-5 → 拼接上下文给 LLM 生成推荐理由；(6) 评估——人工标注 20 条查询的 ground truth，计算 MRR、NDCG@5、Recall@10 三项指标。实操：选取 200 个 Kaggle 数据集 → Embedding 建库 → 设计 10 个语义查询 → 跑通 检索→重排→LLM 生成 的完整管线 → 对比无 RAG（直接问 LLM）与有 RAG 的推荐质量差异。
    duration: 1.5
  自动化论文质量评价与指导:
    detail: |-
      将学位论文指导流程拆分为三个关键检查点，覆盖从开题到终稿的完整生命周期。检查点一——开题报告审计：从研究背景（是否清晰界定研究缺口、文献综述是否覆盖近 5 年前沿）、研究问题（是否具体可操作、是否具有理论或实践价值）、技术路线（方法选择是否合理、数据可获得性是否论证充分）三个维度评估，生成差异化修改建议，区别于"检查点一专属"——聚焦"选题可行性"而非写作质量。检查点二——中期进度督导：要求学生提交当前已完成章节与剩余写作计划，Agent 对比预期进度（按章节权重加权）与实际完成度的偏差，识别滞后章节并分析原因（数据收集受阻/方法理解不足/写作拖延），输出督导报告：进度健康度评分 + 滞后章节的针对性追赶建议 + 调整后的时间规划。检查点三——终稿分级评估：从格式规范（引用格式、图表编号、页眉页脚）、学术表达（术语准确性、句式多样性、逻辑连接词使用）、逻辑结构（章节递进关系、论证完整性、结论与引言呼应）、创新性（方法创新/应用创新/理论创新的识别与权重）四个维度构建评分量规，每维度含 3~5 个可观测子指标（如格式规范下含"参考文献格式一致性 ≥95%""图表标题无缺失""公式编号连续"等），Agent 逐项检查并输出分级修改清单（A 级=可忽略/B 级=建议修改/C 级=必须修改）。核心方法——多维 Prompt 架构：主 Prompt 调用 + 各维度独立子 Prompt 并行评估 + 汇总 Agent 加权合成最终报告，避免单次长 Prompt 的注意力稀释问题。实操：准备开题报告片段/中期进度表/论文章节样本各一份 → 分别跑三个检查点 Agent → 对比 Agent 输出与助教真实反馈的一致性。
    duration: 1.5
  基于CodingAgent的自动化数据分析:
    detail: |-
      核心演示：AI 如何通过"规划→执行→观察→修复"闭环自主完成复杂数据分析任务，区别于前面的 LangGraph 状态机（讲框架设计）与 RAG（讲检索增强），本节聚焦代码生成 Agent 在真实科研数据分析场景的端到端应用。给定原始 CSV 文件（含缺失值、异常值、混合数据类型），Agent 自主完成如下流程：(1) 规划阶段——Agent 先探查数据（列名、类型、缺失率、基本统计量），再生成分析计划（步骤清单 + 每步预期输出 + 依赖关系图），提交用户确认后执行；(2) 执行阶段——按计划逐步用 Python 执行：数据清洗（缺失值填充策略选择、异常值 IQR/Z-score 检测与处理、类型转换）→ 描述性统计（均值/中位数/标准差/偏度/峰度 + 分组聚合）→ 正态性检验（Shapiro-Wilk + Q-Q 图）→ 多组差异分析（ANOVA/Kruskal-Wallis + 事后检验 + 效应量）→ 相关性分析（Pearson/Spearman + 热力图 + 显著性标注）；(3) 修复阶段——当执行报错时，Agent 自动解析 traceback，提取错误类型与行号，生成修复假设（如"KeyError: 列名拼写错误，候选正确列名为..."），执行修复后代码并验证输出合理性，最多重试 3 次后请求人工介入；(4) 报告生成——汇总所有分析结果，自动生成包含表格（describe 统计表、检验结果表）、图表（分布直方图、箱线图、相关热力图）、结论与建议的 Markdown 分析报告。工程要点：subprocess/Docker 沙箱隔离执行、代码执行超时 kill、敏感操作（文件删除/网络请求）黑白名单过滤、中间结果 parquet 持久化避免重复计算。实操：提供医疗/金融/教育三个领域的样例 CSV，学生选择其一让 Agent 跑通全流程，对比 Agent 报告与手动分析的差异。
    duration: 1.5
  Claw业务自动化集成:
    detail: |-
      综合实战课——将本课程全部技术模块串联为可落地的业务自动化方案，区别于前面各节聚焦单一技术点，本节解决"如何把零散能力组装成持续运行的业务系统"这一工程集成问题。核心技术是跨模块编排而非重复讲解已有内容。以 Claw 开放平台为底座，讲解技能集（Skills）的封装与编排：(1) Skill 定义——每个 Skill 是一个自包含的功能单元，包含触发条件（关键词/定时/Cron 表达式/webhook）、执行流程（调用模型→搜索知识库→操作外部 API）、输出动作（消息推送/数据写入/触发下游 Skill），类比"微服务"架构；(2) 知识库 Skill——将 RAG 章节的 Embedding 管线封装为标准 Skill：文档上传→自动分块→向量索引→定时更新，支持手动上传与 RSS/API 自动采集双通道；(3) 数据采集 Skill——定时任务从指定数据源（新闻 RSS、Kaggle 排行榜、GitHub Trending API）抓取原始数据 → 调用 LLM 摘要 → 归档至知识库 → 推送通知；(4) 决策与控制 Skill——知识库存入重要信息时触发分析 Agent 进行情感分析/趋势判断，达到预设阈值则自动通过邮件/Slack/Webhook 发送告警；(5) 自动化闭环演示——以"竞品动态监控"为案例走通完整链路：每日 9:00 自动抓取竞品官网新闻与社交媒体动态 → LLM 提取关键变更（产品功能/定价/人事）→ 与历史数据对比生成变化摘要 → 推送日报到企业微信 → 重要变更触发即时告警；(6) 课程总结——回顾从 OpenAI API 调用（第一章）→ 结构化提示词 + LangChain/LangGraph（第二章）→ 模型本地部署（第三章）→ 行业应用（第四章）→ Claw 业务集成（本章）的技能栈全景，帮助学生建立"API→Agent→应用→业务系统"的递进认知。实操：学生设计自己的自动化场景（如论文 Arxiv 每日跟踪、股票舆情监控），编写 Skill 配置并在 Claw 平台部署运行，确认能收到自动化产出。
    duration: 1.5
