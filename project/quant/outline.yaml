概念入门:
  机器学习概念入门:
    detail: 监督学习 vs 无监督学习；训练集 / 验证集 / 测试集划分；过拟合与欠拟合、交叉验证；线性回归、逻辑回归（概念 + sklearn 一行调用）。
    duration: 2
  深度学习概念入门:
    detail: 神经网络直觉（不推导数学）；损失函数、梯度下降、反向传播；激活函数（ReLU、Sigmoid、Softmax）；PyTorch 搭一个简单分类器。
    duration: 2
  量化研究流程:
    detail: 数据 → 因子 → 模型 → 信号 → 回测；IC / ICIR、Rank IC、分层收益、换手率；搭建简易回测框架。
    duration: 2
实践案例:
  线性回归 + 最简单的量化策略:
    detail: 算法简介：最小二乘法、Ridge / Lasso 正则化；基础因子预测收益率 → TopK 选股 → 回测 → IC 分析。
    duration: 2
  决策树 → 随机森林 + 选股策略:
    detail: 算法简介：信息增益 / Gini 系数、Bagging 集成；sklearn 实现 → 多因子选股 → 回测。
    duration: 2
  LightGBM + 因子筛选策略:
    detail: 算法简介：Boosting、直方图算法、Leaf-wise 生长；IC 筛选、去极值、标准化、中性化 → 回测。
    duration: 2
  XGBoost + 因子重要性分析:
    detail: 算法简介：XGBoost 与 LightGBM 区别；SHAP 分析 → 精简因子 → 效果对比。
    duration: 2
  MLP + 因子非线性组合:
    detail: 算法简介：全连接层、Dropout；PyTorch MLP → 与线性模型对比。
    duration: 2
  LSTM + 收益率预测策略:
    detail: 算法简介：RNN 原理、LSTM 门控机制；滑动窗口构建 → 滚动预测 → 回测。
    duration: 2
  Transformer + 多因子融合:
    detail: 算法简介：Self-Attention / Multi-Head Attention 直觉；LSTM vs Transformer 效果对比。
    duration: 2
  强化学习 + 仓位管理:
    detail: 算法简介：状态 / 动作 / 奖励、DQN 直觉；RL 仓位分配 vs 固定权重回测对比。
    duration: 2
  多模型集成 + 组合优化:
    detail: 融合 ML、DL、RL 信号；行业中性化、换手率约束、单票上限；完整回测报告（IC 曲线、分层收益、净值曲线、年度收益表）。
    duration: 2
