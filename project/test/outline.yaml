经典数学建模趣题:
  第1讲：离散动力系统——从兔子繁殖到PageRank:
    detail: |-
      以"兔子繁殖""赌徒破产""天气预测"等趣味问题切入，介绍离散动力系统的基本概念。讲解一阶线性递推关系的通解——特征根方法，以及马尔可夫链的状态转移矩阵与稳态分布。通过斐波那契数列引入黄金比例 φ=(1+√5)/2 的自然之美。以 Google PageRank 为引子，讲解随机游走与特征向量中心性。实操：用 Python 实现斐波那契递推、模拟马尔可夫链收敛、计算简化版 PageRank。
    duration: 0.1
  第2讲：从蒲丰投针到对冲基金——蒙特卡洛模拟:
    detail: |-
      "用随机性制服确定性"——讲解蒙特卡洛方法的核心思想：通过大量随机采样逼近确定性问题的解。从蒲丰投针求π的几何概率实验出发，讲解随机数的生成（伪随机 vs 真随机）、收敛速度（O(1/√N) 的统计直觉）。深入三个经典应用场景：(1) 三门问题——条件概率的反直觉魅力；(2) 期权定价——几何布朗运动与风险中性定价；(3) 高维积分——为什么蒙特卡洛在高维空间优于网格法。实操：编写蒲丰投针模拟求π、三门问题的频率验证、欧式期权定价模拟。
    duration: 0.1
微分方程建模:
  第3讲：捕食者与猎物——从马尔萨斯到Lotka-Volterra:
    detail: |-
      从"兔子吃草，狐狸吃兔子"的生物链出发，讲解微分方程建模的标准流程：明确变量→建立微分关系→求解或数值模拟→分析结果。重点讲解三个经典模型：(1) 马尔萨斯人口模型（指数增长/衰减）—— dP/dt = rP；(2) 逻辑斯蒂增长模型——引入环境容纳量 K 的 S 形曲线 dP/dt = rP(1-P/K)；(3) Lotka-Volterra 捕食者-猎物模型——两个耦合微分方程的相平面分析、周期振荡与生态平衡。推导平衡点及其稳定性，用 Euler 方法与 RK4 方法对比数值求解精度。实操：用 SciPy 数值求解三种微分方程模型，绘制相图与时间序列图。
    duration: 0.1
  第4讲：传染病动力学——SIR模型与群体免疫:
    detail: |-
      以 COVID-19 等真实疫情为背景，深入经典的仓室模型（Compartmental Model）。逐层构建：(1) SI 模型——最简单的双仓室传播；(2) SIR 模型——引入康复人群，推导基本再生数 R₀ = β/γ 的数学表达与含义（R₀>1 疫情扩散，R₀<1 疫情消退）；(3) SEIR 模型——加入潜伏期暴露仓室。讲解疫苗覆盖率与群体免疫阈值 1-1/R₀ 的关系，以及"拉平曲线"（Flatten the Curve）的数学原理。进阶：探讨网络上的传播模型——小世界网络中传播速度与超级传播者现象。实操：模拟不同 R₀ 下的 SIR 疫情曲线，可视化参数敏感性（接触率 β 与康复率 γ 的影响），对比有无干预措施的曲线差异。
    duration: 0.1
优化与图论:
  第5讲：优化模型——在约束中寻找最优解:
    detail: |-
      "最优方案真的存在吗？"——介绍优化建模的三要素：决策变量、目标函数、约束条件。以经典问题串联：(1) 线性规划——"饮食问题"（满足营养需求下的最低成本）、"运输问题"（多产地到多销地的最小运费），讲解单纯形法的几何直觉（可行域的顶点就是最优候选）；(2) 非线性优化——用梯度下降法可视化"下山"过程，直观解释学习率、局部最优与全局最优的关系；(3) 启发式算法——模拟退火算法的物理类比（缓慢降温使原子达到低能态即最优解），应用于旅行商问题（TSP），对比穷举法 vs 启发式法的效率。实操：用 scipy.optimize 求解饮食问题、实现梯度下降的三维可视化、用模拟退火求解小规模 TSP。
    duration: 0.1
  第6讲：图论中的数学之美——从七桥到社交网络:
    detail: |-
      从欧拉的"七桥问题"（能否不重复地一次走完七座桥？）开启图论之旅。系统讲解图的数学表示——邻接矩阵与邻接表、节点的度与图的连通性。三个核心算法：(1) Dijkstra 最短路径——贪心策略与优先队列实现，从导航到网络路由的应用；(2) Ford-Fulkerson 最大流——在带容量网络中寻找瓶颈，应用于交通分配与资源调度；(3) Watts-Strogatz 小世界网络模型的生成与分析——揭示"六度分隔"背后的数学：高聚类系数 + 短平均路径 = 小世界特性，以社交网络的"你可能认识的人"推荐为案例。实操：用 NetworkX 构建和可视化图、实现最短路径与最大流、生成小世界网络并测量聚类系数与平均路径长度。
    duration: 0.1
随机与贝叶斯:
  第7讲：贝叶斯思维——用数据更新信念:
    detail: |-
      "贝叶斯定理不只是公式，是一种思维方式。"——从条件概率出发，推导贝叶斯公式 P(H|E) = P(E|H)P(H)/P(E)，讲解先验概率、似然、后验概率的直觉含义。经典案例层层递进：(1) 疾病检测的假阳性悖论——患病率 1%、检测准确率 99% 时，阳性结果真正患病的概率只有约 50%？用贝叶斯公式定量解释；(2) 朴素贝叶斯分类器——"属性条件独立"的朴素假设为何在实践中有效？使用高斯朴素贝叶斯做鸢尾花分类；(3) 贝叶斯在线学习——每来一个新数据，后验变先验，持续更新信念分布（Beta 二项分布的共轭特性）。进阶：卡尔曼滤波作为动态贝叶斯推断——递归地用观测修正预测。实操：实现贝叶斯公式计算、朴素贝叶斯分类器、用卡尔曼滤波追踪运动目标轨迹。
    duration: 0.1
  第8讲：混沌与机器学习——两种建模范式的对话:
    detail: |-
      从"蝴蝶效应"出发，讲解确定性系统为何能产生不可预测的行为——混沌的本质是"对初始条件的敏感依赖"。用三个经典案例展示混沌之美：(1) 逻辑斯蒂映射 x_{n+1} = r·x_n·(1-x_n) 的分岔图——倍周期分岔通向混沌的路径；(2) 洛伦兹吸引子——三维混沌系统的双螺旋轨迹；(3) Mandelbrot 集——复平面上最简单的迭代 z_{n+1} = z_n² + c 产生无穷复杂的边界。过渡到现代建模范式：机器学习是"数据驱动"替代"方程驱动"。演示三个机器学习中的核心数学思想：(1) 多项式回归的过拟合——偏差-方差权衡的数学直觉；(2) PCA 降维——协方差矩阵特征值分解的几何解释；(3) SVM 的最大间隔原理——为什么"最宽的街道"泛化能力最好。实操：绘制分岔图与洛伦兹吸引子、可视化多项式过拟合与正则化效果、用 PCA 对高维数据进行二维投影。
    duration: 0.1
