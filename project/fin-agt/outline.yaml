金融智能体核心概念:
  detail: |
    智能体核心定义：自主感知环境、做出决策并执行动作的AI实体，区别于传统RPA的规则驱动。金融行业典型场景：智能投顾、自动化研报生成、实时风控监控、交易策略执行。课程项目预览：最终将搭建“金融投研助手”，集成数据查询、情绪分析、资产配置能力。
    大模型基础：Transformer架构的注意力机制、预训练+微调范式、GPT/LLaMA/Qwen等主流模型对比。API调用实践：OpenAI兼容协议，解析URL/Header/Body结构，理解model、messages（system/user/assistant角色语义）、stream参数。金融小实验：调用大模型API完成“给定公司财报摘要，生成投资风险提示”，体验从输入到结构化输出的完整流程。
  duration: 0.5
金融提示词工程实战:
  detail: |
    提示词基本结构：角色设定（Persona）、任务描述（Task）、输出格式约束（Format），引入CO-STAR框架（Context-Objective-Style-Tone-Audience-Response）。金融专项技巧：使用少样本（Few-shot）嵌入财报分析范例、引入思维链（CoT）让模型展示推理过程、添加反事实约束避免幻觉。案例：从混乱的金融新闻中提取关键实体与事件。
    金融提示词实战：新闻情绪分析（多头/空头/中性打分）、投资建议约束练习（强制输出风险声明和逻辑依据）。作业与点评：现场完成提示词设计并互相点评。
    就业辅导-简历写作：AI时代的职场新坐标——提示词工程师、AI产品经理、大模型应用开发等岗位的技能要求；简历精修指南——用STAR法则量化项目经历，突出大模型API调用、工作流搭建、Agent开发等实战经验。
  duration: 0.5
Coze平台知识库构建:
  detail: |
    Coze界面与核心功能：Bot创建面板、插件市场、知识库、工作流、持久化记忆。创建第一个金融Bot：配置人设与回复逻辑，测试对话。调试与迭代：预览窗口的日志分析、变量追踪。
    金融知识库构建：数据准备——收集金融术语表、证券法规PDF、公司财报文本。文档导入与分段策略：自动分段 vs 自定义分段（按标题/章节），设置chunk大小与重叠。测试金融问答：上传知识库后，询问“什么是RSI指标？”或“最新减持新规的核心要求”，对比无知识库时的回答差异，观察引用来源功能。
  duration: 0.5
工作流情绪分析实战:
  detail: |
    工作流核心概念：节点、边、条件分支、变量传递。构建“简单资产配置建议工作流”：输入用户年龄、风险偏好（保守/稳健/激进），经过条件分支选择对应资产配置模板（如“30%债券+70%股票”），输出建议。金融案例延伸：加入约束条件（如“用户有房贷”时降低高风险资产占比）。
    市场情绪分析工作流：案例——从社交媒体文本或新闻标题中提取情绪关键词，通过LLM节点打分（-1到1）。实操：构建完整工作流，输入一段关于美联储加息的新闻，输出情绪分数、趋势判断（看涨/看跌/震荡）、置信度。
  duration: 0.5
风险价值工作流调试:
  detail: |
    风险价值(VaR)与压力测试工作流：原理简述——VaR（95%置信度下的最大可能损失），历史模拟法与参数法对比。工作流设计——输入资产组合（股票代码+权重），调用API获取历史价格，计算日收益率，输出VaR值及压力测试情景（如市场暴跌10%时的损失）。案例：给定“60%沪深300+40%中证500”，计算1日VaR。
    工作流整合与调试：错误处理——添加Try-Catch节点，识别API超时或数据缺失时返回友好提示。性能优化——并行调用多个API、缓存常用数据。小组练习：组合前两个工作流，构建“先情绪分析→再根据情绪调整VaR参数”的复合流程。
  duration: 0.5
Dify智能体开发:
  detail: |
    Dify核心概念：应用类型（聊天助手/Agent/工作流）、工具定义（OpenAPI/Swagger）、知识库集成。构建第一个金融API工具：封装一个模拟的股票价格API（输入代码返回价格），测试调用。
    Agent模式与函数调用：ReAct原理（Reason+Act循环）——模型生成思考→决定调用工具→观察结果→再思考直至得出最终答案。实战：构建“金融数据助理”Agent，配备“查询市盈率”“查询财报发布日期”“计算年化收益率”三个工具，用户问“腾讯当前PE比阿里高多少？”时，Agent自动规划并调用工具。提示词编排：在系统提示中明确工具使用边界和组合策略，防止过度调用。
  duration: 0.5
高级工作流调优技术:
  detail: |
    高级工作流与外部API深度集成：Dify工作流中的HTTP请求节点——支持GET/POST，配置Headers与Params，解析JSON响应。构建“实时舆情监控与影响分析”工作流：定时从NewsAPI抓取关键词“A股”相关新闻，调用LLM提取情感及影响行业（如“新能源”“消费”），将结果存入Google Sheets或发送企业微信。案例：监控“半导体政策”舆情，自动生成日报。
    提示词与工具调优（针对金融幻觉）：常见金融智能体问题——杜撰不存在的财报数据、混淆相似股票代码、忽略风险提示。调优策略：强制在提示词中加入“若不确定请回答‘未找到’并引用来源”；使用低temperature（0.2）降低随机性；在工具输出后增加验证节点（如检查PE值是否在合理区间0~100）。练习：给一个容易产生幻觉的prompt，通过添加格式约束和事实核查指令来修正。
  duration: 0.5
