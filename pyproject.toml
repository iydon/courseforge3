[project]
name = "courseforge"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "pypdf2>=3.0.1",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
    "tqdm>=4.67.3",
]

[tool.setuptools]
packages = ["courseforge"]

[tool.uv.workspace]
members = [
    "project/big-data",
    "project/fin-agt",
    "project/llm-dev",
    "project/quant",
    "project/test",
]
